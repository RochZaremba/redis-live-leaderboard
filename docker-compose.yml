services:
  redis:
    image: redis:7.2-alpine
    container_name: quiz-leaderboard-redis
    ports:
      - "6380:6379"
    command: ["redis-server", "--appendonly", "yes"]
    volumes:
      - redis-data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10

  backend:
    build:
      context: ./backend
    container_name: quiz-leaderboard-backend
    environment:
      REDIS_URL: redis://redis:6379/0
      CORS_ORIGINS: http://localhost:${GATEWAY_PORT:-3000}
      WEEKLY_LEADERBOARD_TTL_SECONDS: 1209600
    depends_on:
      redis:
        condition: service_healthy
    volumes:
      - ./backend/app:/app/app
      - ./backend/tests:/app/tests

  frontend:
    build:
      context: ./frontend
      args:
        VITE_API_URL: http://localhost:${GATEWAY_PORT:-3000}
    container_name: quiz-leaderboard-frontend
    depends_on:
      - backend

  gateway:
    build:
      context: ./gateway
    container_name: quiz-leaderboard-gateway
    environment:
      GATEWAY_PORT: ${GATEWAY_PORT:-3000}
    ports:
      - "${GATEWAY_PORT:-3000}:${GATEWAY_PORT:-3000}"
    depends_on:
      - backend
      - frontend

volumes:
  redis-data:
